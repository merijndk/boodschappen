<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#228b57" />
  <title>Boodschappen</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Boodschappen" />

  <style>
    :root {
      --green: #228b57;
      --green-dark: #1b6f46;
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1c1e21;
      --muted: #8a8f98;
      --danger: #22c55e;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      height: 100%;
      overscroll-behavior-y: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* Top bar */
    header {
      background: var(--green);
      padding: calc(env(safe-area-inset-top) + 10px) 12px 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      z-index: 10;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border-radius: 12px;
      padding: 4px 4px 4px 14px;
    }

    #newItem {
      flex: 1;
      border: none;
      outline: none;
      font-size: 17px;
      padding: 12px 0;
      background: transparent;
      color: var(--text);
    }

    #addBtn {
      border: none;
      background: var(--green);
      color: #fff;
      font-size: 22px;
      line-height: 1;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      flex: 0 0 auto;
      cursor: pointer;
    }
    #addBtn:active { background: var(--green-dark); }

    #status {
      color: rgba(255,255,255,0.9);
      font-size: 12px;
      min-height: 14px;
      margin: 6px 4px 0;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    /* List */
    main {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 12px calc(env(safe-area-inset-bottom) + 24px);
    }

    #list { list-style: none; margin: 0; padding: 0; }

    .row {
      position: relative;
      margin-bottom: 8px;
      border-radius: 12px;
      overflow: hidden;
      background: var(--danger);
    }

    /* the "done" hint revealed while swiping */
    .row::before {
      content: "✓";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      padding-left: 22px;
      color: #fff;
      font-size: 22px;
      font-weight: 700;
    }

    .item {
      position: relative;
      background: var(--card);
      padding: 16px 16px;
      font-size: 17px;
      touch-action: pan-y;
      will-change: transform;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      word-break: break-word;
    }
    .item.dragging { transition: none; }
    .item.settling { transition: transform 0.2s ease; }

    .empty {
      text-align: center;
      color: var(--muted);
      margin-top: 20vh;
      font-size: 16px;
      padding: 0 24px;
    }
    .empty span { font-size: 40px; display: block; margin-bottom: 10px; }
  </style>
</head>
<body>
  <header>
    <form class="input-wrap" id="form" autocomplete="off">
      <input
        id="newItem"
        type="text"
        placeholder="Voeg iets toe…"
        enterkeyhint="done"
        autocapitalize="sentences"
      />
      <button id="addBtn" type="submit" aria-label="Toevoegen">+</button>
    </form>
    <div id="status" aria-live="polite"></div>
  </header>

  <main>
    <ul id="list"></ul>
    <div class="empty" id="empty">
      <span>🛒</span>
      Je lijst is leeg.<br />Typ hierboven en druk op enter.
    </div>
  </main>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>

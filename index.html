<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#228b57" />
  <title>Boodschappen</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Boodschappen" />

  <style>
    :root {
      --green: #228b57;
      --green-dark: #1b6f46;
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1c1e21;
      --muted: #8a8f98;
      --danger: #22c55e;
      --trash: #c0392b;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      height: 100%;
      overscroll-behavior-y: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* Top bar */
    header {
      background: var(--green);
      padding: calc(env(safe-area-inset-top) + 10px) 12px 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      z-index: 10;
    }

    .top-row { display: flex; align-items: center; gap: 8px; }

    .input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border-radius: 12px;
      padding: 4px 4px 4px 14px;
    }

    #newItem, .field {
      flex: 1;
      border: none;
      outline: none;
      font-size: 17px;
      padding: 12px 0;
      background: transparent;
      color: var(--text);
    }

    #addBtn {
      border: none;
      background: var(--green);
      color: #fff;
      font-size: 22px;
      line-height: 1;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      flex: 0 0 auto;
      cursor: pointer;
    }
    #addBtn:active { background: var(--green-dark); }

    .book-btn {
      flex: 0 0 auto;
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.16);
      color: #fff;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }
    .book-btn:active { background: rgba(255,255,255,0.30); }

    #status {
      color: rgba(255,255,255,0.9);
      font-size: 12px;
      min-height: 14px;
      margin: 6px 4px 0;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    /* List */
    main {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 12px calc(env(safe-area-inset-bottom) + 24px);
    }

    ul.list { list-style: none; margin: 0; padding: 0; }

    .row {
      position: relative;
      margin-bottom: 8px;
      border-radius: 12px;
      overflow: hidden;
      background: var(--danger);
    }

    .row::before {
      content: "✓";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      padding-left: 22px;
      color: #fff;
      font-size: 22px;
      font-weight: 700;
    }

    .item {
      position: relative;
      display: flex;
      align-items: stretch;
      background: var(--card);
      touch-action: pan-y;
      will-change: transform;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .item.dragging { transition: none; }
    .item.settling { transition: transform 0.2s ease; }

    .item-main {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      text-align: left;
      border: none;
      background: transparent;
      font: inherit;
      font-size: 17px;
      color: var(--text);
      padding: 16px;
      cursor: pointer;
    }
    .item-main:active { background: rgba(0,0,0,0.03); }
    .item-name { flex: 1; min-width: 0; word-break: break-word; }
    .item-qty {
      flex: 0 0 auto;
      min-width: 26px;
      height: 26px;
      padding: 0 8px;
      border-radius: 13px;
      background: var(--green);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .item-trash {
      flex: 0 0 auto;
      width: 52px;
      border: none;
      background: transparent;
      color: var(--trash);
      font-size: 18px;
      cursor: pointer;
    }
    .item-trash:active { background: rgba(192,57,43,0.08); }

    .empty {
      text-align: center;
      color: var(--muted);
      margin-top: 20vh;
      font-size: 16px;
      padding: 0 24px;
    }
    .empty span { font-size: 40px; display: block; margin-bottom: 10px; }

    /* ---- Recipe modal ---- */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.25s ease;
    }
    .modal.open { transform: translateY(0); }

    .modal-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .modal-view[hidden] { display: none; }

    .modal-bar {
      background: var(--green);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: calc(env(safe-area-inset-top) + 8px) 6px 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .modal-bar h2 {
      flex: 1;
      margin: 0;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
    }
    .icon-btn {
      border: none;
      background: transparent;
      color: #fff;
      font-size: 24px;
      line-height: 1;
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      cursor: pointer;
    }
    .text-btn {
      border: none;
      background: transparent;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      padding: 0 12px;
      height: 44px;
      flex: 0 0 auto;
      cursor: pointer;
    }
    .text-btn:disabled { opacity: 0.45; }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 12px calc(env(safe-area-inset-bottom) + 24px);
    }

    .name-field {
      width: 100%;
      border: none;
      outline: none;
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      margin-bottom: 10px;
    }

    .modal-body .input-wrap {
      background: var(--card);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      margin-bottom: 12px;
    }
    .modal-body .input-wrap .field { padding: 12px 0; }

    .section-label {
      color: var(--muted);
      font-size: 13px;
      margin: 4px 4px 8px;
    }

    /* Recipe list rows */
    .recipe-row {
      display: flex;
      align-items: stretch;
      background: var(--card);
      border-radius: 12px;
      margin-bottom: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      overflow: hidden;
    }
    .recipe-tap {
      flex: 1;
      text-align: left;
      border: none;
      background: transparent;
      padding: 14px 16px;
      cursor: pointer;
      min-width: 0;
    }
    .recipe-tap .r-name {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      display: block;
    }
    .recipe-tap .r-sub {
      font-size: 13px;
      color: var(--muted);
      display: block;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .recipe-tap:active { background: rgba(0,0,0,0.03); }
    .recipe-del {
      border: none;
      background: transparent;
      color: var(--trash);
      font-size: 20px;
      width: 52px;
      flex: 0 0 auto;
      cursor: pointer;
    }
    .recipe-del:active { background: rgba(192,57,43,0.08); }

    /* ---- Edit popup (name + amount stepper) ---- */
    .sheet {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .sheet.open { opacity: 1; pointer-events: auto; }
    .sheet-panel {
      background: var(--card);
      border-radius: 16px;
      width: min(92vw, 420px);
      padding: 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
      transform: translateY(10px);
      transition: transform 0.2s ease;
    }
    .sheet.open .sheet-panel { transform: none; }
    .sheet .name-field { margin-bottom: 16px; }
    .stepper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin-bottom: 18px;
    }
    .step-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 2px solid var(--green);
      background: #fff;
      color: var(--green);
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
    }
    .step-btn:active { background: var(--green); color: #fff; }
    .step-val { font-size: 28px; font-weight: 700; min-width: 44px; text-align: center; }
    .sheet-actions { display: flex; gap: 10px; }
    .sheet-actions button {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-cancel { background: #eceef1; color: var(--text); }
    .btn-save { background: var(--green); color: #fff; }
  </style>
</head>
<body>
  <header>
    <div class="top-row">
      <form class="input-wrap" id="form" autocomplete="off">
        <input
          id="newItem"
          type="text"
          placeholder="Voeg iets toe…"
          enterkeyhint="done"
          autocapitalize="sentences"
        />
        <button id="addBtn" type="submit" aria-label="Toevoegen">+</button>
      </form>
      <button id="bookBtn" class="book-btn" type="button" aria-label="Recepten">📖</button>
    </div>
    <div id="status" aria-live="polite"></div>
  </header>

  <main>
    <ul id="list" class="list"></ul>
    <div class="empty" id="empty">
      <span>🛒</span>
      Je lijst is leeg.<br />Typ hierboven en druk op enter.
    </div>
  </main>

  <!-- Recipe book modal -->
  <div class="modal" id="recipeModal" aria-hidden="true">
    <!-- Recipe list view -->
    <section class="modal-view" data-view="list">
      <div class="modal-bar">
        <button class="icon-btn" id="recipeClose" type="button" aria-label="Sluiten">✕</button>
        <h2>Recepten</h2>
        <button class="icon-btn" id="recipeNewBtn" type="button" aria-label="Nieuw recept">+</button>
      </div>
      <div class="modal-body">
        <ul id="recipeList" class="list"></ul>
        <div class="empty" id="recipeEmpty">
          <span>📖</span>
          Nog geen recepten.<br />Tik op + om er een te maken.
        </div>
      </div>
    </section>

    <!-- New recipe view -->
    <section class="modal-view" data-view="new" hidden>
      <div class="modal-bar">
        <button class="icon-btn" id="recipeBack" type="button" aria-label="Terug">‹</button>
        <h2>Nieuw recept</h2>
        <button class="text-btn" id="recipeSave" type="button">Bewaar</button>
      </div>
      <div class="modal-body">
        <input class="name-field" id="recipeName" type="text" placeholder="Naam van recept…" autocapitalize="sentences" />
        <div class="section-label">Ingrediënten</div>
        <form class="input-wrap" id="ingredientForm" autocomplete="off">
          <input class="field" id="ingredientInput" type="text" placeholder="Voeg ingrediënt toe…" enterkeyhint="done" autocapitalize="sentences" />
          <button class="icon-btn" type="submit" aria-label="Toevoegen" style="color:var(--green);width:44px;">+</button>
        </form>
        <ul id="ingredientList" class="list"></ul>
      </div>
    </section>
  </div>

  <!-- Edit popup: change name + amount -->
  <div class="sheet" id="editSheet" aria-hidden="true">
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <input class="name-field" id="editName" type="text" autocapitalize="sentences" enterkeyhint="done" />
      <div class="stepper">
        <button class="step-btn" id="editMinus" type="button" aria-label="Minder">−</button>
        <div class="step-val" id="editAmount">1</div>
        <button class="step-btn" id="editPlus" type="button" aria-label="Meer">+</button>
      </div>
      <div class="sheet-actions">
        <button class="btn-cancel" id="editCancel" type="button">Annuleer</button>
        <button class="btn-save" id="editSaveBtn" type="button">Bewaar</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
